services:
  - type: web
    name: uber-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: uber-postgres
          property: connectionString
      - key: MLFLOW_TRACKING_URI
        value: http://localhost:5000
      - key: PYTHONUTF8
        value: "1"

databases:
  - name: uber-postgres
    plan: free
    databaseName: nyc_taxi
