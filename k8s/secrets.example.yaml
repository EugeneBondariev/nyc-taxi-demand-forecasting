# K8s secret and configmap required by k8s/deployment.yaml
# Create them from your .env values (see Makefile: make k8s-deploy)
# or apply this file after replacing the placeholder values.
#
# Encode a value: echo -n 'yourvalue' | base64
apiVersion: v1
kind: Secret
metadata:
  name: uber-secrets
type: Opaque
data:
  database-url: <base64-encoded-postgres-url>
  api-key: <base64-encoded-api-key>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: uber-config
data:
  mlflow-uri: http://mlflow:5000
