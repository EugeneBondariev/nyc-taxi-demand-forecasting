apiVersion: apps/v1
kind: Deployment
metadata:
  name: uber-api
  labels:
    app: uber-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uber-api
  template:
    metadata:
      labels:
        app: uber-api
    spec:
      containers:
        - name: uber-api
          image: uber-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: uber-secrets
                  key: database-url
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: uber-secrets
                  key: api-key
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                configMapKeyRef:
                  name: uber-config
                  key: mlflow-uri
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
